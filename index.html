<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Mini App — Connect</title>
	</head>
	<body
		style="
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			background: #1e1f22;
			color: #dbdee1;
			font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			text-align: center;
			padding: 24px;
		"
	>
		<div style="font-size: 48px">🌌</div>
		<h1 style="margin: 0; color: #fff; font-size: 24px">
			Connect your Mini App account
		</h1>
		<p style="margin: 0; color: hsl(214 8.1% 61.2%)">
			You'll be redirected to <strong>Discord</strong> to verify your linked
			roles. This only takes a moment.
		</p>
		<script>
			const oauthUrl = "{{OAUTH_URL_RAW}}";
			const isPlaceholder =
				typeof oauthUrl !== "string" ||
				!oauthUrl.length ||
				oauthUrl.includes("{{");

			if (!isPlaceholder) {
				window.location.replace(oauthUrl);
			} else {
				document.querySelector("p").innerHTML =
					"<strong>ERROR:</strong> OAuth URL is not configured.";
			}
		</script>
	</body>
</html>
